services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bh_assurance?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_jwt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production_refresh}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AGENT_URL: ${AGENT_URL:-http://agent:3002}
      AGENT_API_KEY: ${AGENT_API_KEY:-agent-api-key-change-me-in-production}
      PORT: 3001
      NODE_ENV: development
      AGENT_SESSIONS_DIR: /app/backend/data/agent-sessions
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    command: ["/bin/sh", "/usr/local/bin/docker-entrypoint.dev.sh"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "-w", "frontend", "--", "--hostname", "0.0.0.0"]

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: bh-assurance-agent-1
    env_file:
      - .env
    environment:
      AGENT_PORT: 3002
      AGENT_MODE: http
    ports:
      - "3002:3002"
    restart: unless-stopped
