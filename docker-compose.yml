services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bh_assurance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bh_assurance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bh_assurance?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_jwt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production_refresh}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AGENT_URL: ${AGENT_URL:-http://agent:3002}
      AGENT_API_KEY: ${AGENT_API_KEY:-agent-api-key-change-me-in-production}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: bh-assurance-agent-1
    env_file:
      - .env
    environment:
      AGENT_PORT: 3002
      AGENT_MODE: http
    ports:
      - "3002:3002"
    restart: unless-stopped

volumes:
  postgres_data:
